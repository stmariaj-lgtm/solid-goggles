<section id="story" class="screen" hidden><div class="terminal"><div><span id="typed" class="typed"></span><span id="cursor" class="cursor" aria-hidden="true"></span></div><div id="choices" class="choices" hidden><button data-role="маг">{маг}</button><button data-role="лицар">{лицар}</button><button data-role="монстр">{монстр}</button></div></div></section>
<section id="confirm" class="screen confirm" hidden><form id="ritual" class="ritual"><p class="eyebrow">IX / ПОТРІБНЕ ПІДТВЕРДЖЕННЯ</p><h1>підтвердіть ваш вибір написавши слово «бурмалда»</h1><p id="chosen"></p><label for="word">введіть таємне слово...</label><input id="word" autocomplete="off" spellcheck="false" required aria-describedby="error privacy"><p id="error" class="error" role="alert"></p><button class="outline" type="submit">підтвердити вибір...</button><p id="privacy" class="note"></p></form></section>
<section id="ending" class="screen fish-screen" hidden><div class="ending"><p class="eyebrow">IX / ПОСЛАНЕЦЬ МІЖ СВІТАМИ</p><svg id="fish" class="fish" viewBox="0 0 560 300" role="img" aria-label="Чарівна риба, що розмовляє"><defs><linearGradient id="scales" x2=".3" y2="1"><stop stop-color="#83d1ae"/><stop offset=".48" stop-color="#2e807a"/><stop offset="1" stop-color="#0f354b"/></linearGradient><pattern id="scalePattern" width="26" height="22" patternUnits="userSpaceOnUse"><path d="M0 2 Q13 26 26 2" fill="none" stroke="#b8eacc" stroke-opacity=".17" stroke-width="2"/></pattern></defs><path d="M168 147 Q70 71 48 76 L69 157 44 231 Q110 225 174 174" fill="#285e67" stroke="#61a398" stroke-width="3"/><path d="M189 105 Q240 8 328 44 L351 95 M196 204 Q253 277 320 229 L342 199" fill="#296569" stroke="#57988c" stroke-width="3"/><path d="M139 154 C156 73 304 44 404 90 Q454 112 467 151 L446 164 466 182 Q427 239 319 232 C224 229 162 207 139 154Z" fill="url(#scales)" stroke="#92baa6" stroke-width="3"/><path d="M139 154 C156 73 304 44 404 90 Q454 112 467 151 L446 164 466 182 Q427 239 319 232 C224 229 162 207 139 154Z" fill="url(#scalePattern)"/><path d="M334 106 Q302 160 339 209" fill="none" stroke="#092f3d" stroke-width="5"/><path d="M307 156 Q233 151 265 212 Q301 195 322 170" fill="#36777a" stroke="#7eafa1" stroke-width="2"/><circle cx="399" cy="127" r="22" fill="#d6d690"/><circle cx="405" cy="128" r="12" fill="#061019"/><circle cx="410" cy="122" r="5" fill="#fff"/><path d="M425 160 Q452 153 474 161 Q461 183 432 181Z" fill="#040c13"/><g class="jaw"><path d="M428 176 Q451 181 475 173 Q463 208 424 211 L407 193" fill="#56988e" stroke="#a0c8ad" stroke-width="3"/></g><path d="M76 112L146 150M69 157L139 158M69 209L145 168" stroke="#71a39a" stroke-opacity=".5" stroke-width="2"/></svg><p class="fish-line">очікуйте листа з запрошенням у наступну частину історії</p><button id="repeat" class="outline">↻ прослухати ще раз</button><p id="delivery" class="delivery" role="status"></p></div></section><div id="flash" class="flash"></div>
<script>
// Для автоматичних листів задайте HTTPS endpoint своєї форми/сервера.
// Він має приймати JSON {character, story} і надсилати лист на st.mariaj@gmail.com.
// Не вставляйте секретні ключі поштового сервісу в цей файл.
const EMAIL_ENDPOINT = '/api/confirm';
const FORM_TOKEN = {{ token | tojson }};
const $=id=>document.getElementById(id);
const reduced=window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;
let selected='',started=false,confirmed=false,speechTimer;
function show(id){for(const name of ['intro','story','confirm','ending']) $(name).hidden=name!==id;window.scrollTo(0,0)}
const narrative="ти потрапив в загадковий дев'ятий вимір....\nна тебе очікує новий шлях воїне.....\nобери для початку ким хочеш бути...";
async function typeStory(){for(const char of narrative){$('typed').textContent+=char;if(!reduced)await new Promise(r=>setTimeout(r,char==='\n'?650:char==='.'?160:48))}$('cursor').hidden=true;$('choices').hidden=false;$('choices').querySelector('button').focus()}
$('orb').onclick=()=>{if(started)return;started=true;$('flash').classList.add('active');setTimeout(()=>{show('story');typeStory()},reduced?100:680);setTimeout(()=>$('flash').classList.remove('active'),1800)};
for(const button of document.querySelectorAll('[data-role]'))button.onclick=()=>{selected=button.dataset.role;$('chosen').textContent='твій шлях: '+selected+'...';$('privacy').textContent='Обраний персонаж передається авторці історії.';show('confirm');$('word').focus()};
function speak(){clearTimeout(speechTimer);const fish=$('fish');fish.classList.add('speaking');const stop=()=>{fish.classList.remove('speaking');clearTimeout(speechTimer)};speechTimer=setTimeout(stop,9000);if('speechSynthesis'in window){speechSynthesis.cancel();const line=new SpeechSynthesisUtterance('очікуйте листа з запрошенням у наступну частину історії');line.lang='uk-UA';line.rate=.83;line.pitch=.65;const voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('uk'));if(voice)line.voice=voice;line.onend=stop;line.onerror=()=>{speechTimer=setTimeout(stop,5000)};speechSynthesis.speak(line)}}
let sending=false;
$('ritual').addEventListener('submit', async event=>{
  event.preventDefault();
  if(sending || confirmed) return;
  const word=$('word').value.trim().toLowerCase();
  if(word!=='бурмалда'){
    $('error').textContent='помилка... введи слово «бурмалда»...';
    $('word').setAttribute('aria-invalid','true');$('word').focus();return;
  }
  sending=true;const button=$('ritual').querySelector('button[type=submit]');
  button.disabled=true;button.textContent='відкриваємо портал...';
  $('error').textContent='';$('word').removeAttribute('aria-invalid');
  const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),20000);
  try {
    const response=await fetch(EMAIL_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({character:selected,word,token:FORM_TOKEN}),signal:controller.signal});
    const result=await response.json();
    if(!response.ok || !result.ok) throw new Error(result.error || 'Портал не відповідає...');
    confirmed=true;show('ending');$('repeat').focus();
    // Audio failure must never block the confirmation or email request.
    try{speak()}catch(e){$('fish').classList.remove('speaking')}
  }catch(e){
    $('error').textContent=e.name==='AbortError'?'Зв’язок перервався... спробуй ще раз.':(e.message || 'Не вдалося підтвердити вибір...');
  }finally{
    clearTimeout(timer);sending=false;button.disabled=false;button.textContent='підтвердити вибір...';
  }
});
$('repeat').onclick=()=>{try{speak()}catch(e){$('fish').classList.remove('speaking')}};
</script></body></html>
